<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&family=Mukta:wght@400;500;600;700;800&family=Mukta+Mahee:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#221c2e; --ink-70:rgba(34,28,46,.70); --ink-55:rgba(34,28,46,.55);
  --ink-40:rgba(34,28,46,.40); --ink-12:rgba(34,28,46,.12); --ink-08:rgba(34,28,46,.08);
  --red:#e0362f; --org:#f97316; --vio:#7c3aed; --teal:#0d9488;
  --paper:#fbf7f3; --card:#ffffff;
  --grad:linear-gradient(135deg,#e0362f,#f97316);
  --grad-soft:linear-gradient(135deg,rgba(224,54,47,.10),rgba(249,115,22,.10));
  --sh-1:0 2px 10px rgba(34,28,46,.06);
  --sh-2:0 10px 26px rgba(34,28,46,.10);
  --sh-hot:0 12px 28px rgba(224,54,47,.30);
  --r-lg:22px; --r-md:16px; --r-sm:12px;
  --fs:'Archivo','Mukta','Mukta Mahee',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
}
html[data-lang="hi"]{ --fs:'Mukta','Archivo',sans-serif; }
html[data-lang="pa"]{ --fs:'Mukta Mahee','Archivo',sans-serif; }

*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:var(--fs); color:var(--ink); background:#efe9e3;
  font-size:16px; line-height:1.45; -webkit-font-smoothing:antialiased;
}
body::before{
  content:''; position:fixed; inset:0; z-index:0; pointer-events:none;
  background:
    radial-gradient(60vw 40vw at 10% -5%, rgba(224,54,47,.14), transparent 60%),
    radial-gradient(50vw 40vw at 100% 100%, rgba(124,58,237,.12), transparent 60%);
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:3px solid var(--vio); outline-offset:2px; border-radius:6px}
@media (prefers-reduced-motion:reduce){ *{animation:none!important;transition:none!important} }

/* ---------- shell ---------- */
#app{
  position:relative; z-index:1;
  max-width:480px; margin:0 auto; min-height:100dvh;
  background:var(--paper); display:flex; flex-direction:column;
  box-shadow:0 0 60px rgba(34,28,46,.16);
}
.scroll{flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; padding-bottom:26px}
.pad{padding:0 18px}

/* ---------- topbar ---------- */
.top{
  position:sticky; top:0; z-index:20; background:var(--paper);
  padding:calc(env(safe-area-inset-top) + 12px) 18px 12px;
  display:flex; align-items:center; gap:12px; border-bottom:1px solid var(--ink-08);
}
.top.hot{
  background:var(--grad); color:#fff; border-bottom:0;
  border-radius:0 0 26px 26px; padding-bottom:22px;
}
.top .eyebrow{font-size:11.5px; font-weight:700; letter-spacing:.10em; text-transform:uppercase; opacity:.72}
.top h1{font-size:22px; font-weight:800; letter-spacing:-.015em; line-height:1.2}
.top .grow{flex:1; min-width:0}
.iconbtn{
  width:42px;height:42px;border-radius:14px;display:grid;place-items:center;
  background:var(--ink-08); color:var(--ink); flex:none; font-size:18px; font-weight:800;
}
.top.hot .iconbtn{background:rgba(255,255,255,.22); color:#fff}
.langbtn{
  height:42px; padding:0 14px; border-radius:14px; font-size:13.5px; font-weight:800;
  background:var(--ink-08); display:flex; align-items:center; gap:7px; flex:none;
}
.top.hot .langbtn{background:rgba(255,255,255,.22); color:#fff}

/* ---------- cards & type ---------- */
.card{background:var(--card); border-radius:var(--r-lg); box-shadow:var(--sh-1); padding:18px}
.card+.card{margin-top:14px}
.sec{margin-top:22px}
.sec-h{display:flex; align-items:baseline; justify-content:space-between; margin-bottom:12px}
.sec-h h2{font-size:16.5px; font-weight:800; letter-spacing:-.01em}
.sec-h a,.sec-h button{font-size:13px; font-weight:800; color:var(--red)}
.muted{color:var(--ink-55); font-size:13.5px}
.tiny{font-size:12px; color:var(--ink-55)}
.hr{height:1px; background:var(--ink-08); margin:14px 0}

/* ---------- buttons ---------- */
.btn{
  display:flex; align-items:center; justify-content:center; gap:10px;
  width:100%; min-height:56px; border-radius:18px; font-size:16px; font-weight:800;
  background:var(--grad); color:#fff; box-shadow:var(--sh-hot); padding:0 18px;
  transition:transform .12s ease;
}
.btn:active{transform:scale(.985)}
.btn[disabled]{background:var(--ink-12); color:var(--ink-40); box-shadow:none}
.btn.ghost{background:var(--card); color:var(--ink); box-shadow:var(--sh-1)}
.btn.line{background:transparent; color:var(--ink); box-shadow:inset 0 0 0 2px var(--ink-12)}
.btn.sm{min-height:46px; font-size:14px; border-radius:14px}
.btn .right{margin-left:auto; font-weight:700; opacity:.92}

/* ---------- forms ---------- */
.field{margin-top:14px}
.field label{display:block; font-size:12.5px; font-weight:800; color:var(--ink-55); margin-bottom:7px; letter-spacing:.02em}
.input,textarea.input{
  width:100%; min-height:54px; border-radius:16px; background:#fff;
  box-shadow:inset 0 0 0 2px var(--ink-12); padding:14px 16px; font-size:16px; font-weight:600;
}
textarea.input{min-height:86px; resize:vertical; line-height:1.4}
.input:focus{box-shadow:inset 0 0 0 2px var(--vio); outline:none}
.input::placeholder{color:var(--ink-40); font-weight:500}
.phonewrap{display:flex; gap:10px; align-items:stretch}
.phonewrap .pre{
  display:flex; align-items:center; padding:0 16px; border-radius:16px; font-weight:800;
  background:#fff; box-shadow:inset 0 0 0 2px var(--ink-12); flex:none;
}
.err{color:var(--red); font-size:13px; font-weight:700; margin-top:8px}
.ok{color:var(--teal); font-size:13px; font-weight:700; margin-top:8px}

/* ---------- chips / pills ---------- */
.row{display:flex; gap:9px; flex-wrap:wrap}
.chip{
  padding:11px 15px; border-radius:14px; font-size:14px; font-weight:700;
  background:#fff; box-shadow:var(--sh-1); color:var(--ink); min-height:46px;
  display:flex; align-items:center;
}
.chip.on{background:var(--grad); color:#fff; box-shadow:var(--sh-hot)}
.scrollx{display:flex; gap:9px; overflow-x:auto; padding:2px 18px 4px; scrollbar-width:none}
.scrollx::-webkit-scrollbar{display:none}
.scrollx .chip{flex:none}

/* ---------- home tiles ---------- */
.tiles{display:grid; grid-template-columns:1fr 1fr; gap:12px}
.tile{
  border-radius:20px; padding:16px; text-align:left; color:#fff; min-height:108px;
  display:flex; flex-direction:column; justify-content:space-between;
}
.tile .t{font-size:14.5px; font-weight:800; line-height:1.25}
.tile .p{font-size:24px; font-weight:900; letter-spacing:-.02em}
.tile .p small{font-size:11.5px; font-weight:700; opacity:.85}
.tile.a{background:linear-gradient(150deg,#e0362f,#f97316); box-shadow:0 12px 26px rgba(224,54,47,.26)}
.tile.b{background:linear-gradient(150deg,#7c3aed,#c026d3); box-shadow:0 12px 26px rgba(124,58,237,.26)}
.tile.c{background:linear-gradient(150deg,#0ea5e9,#0d9488); box-shadow:0 12px 26px rgba(13,148,136,.26)}
.tile.d{background:linear-gradient(150deg,#f59e0b,#e0362f); box-shadow:0 12px 26px rgba(245,158,11,.26)}

/* ---------- rate rows ---------- */
.item{padding:14px 0; border-bottom:1px solid var(--ink-08)}
.item:last-child{border-bottom:0}
.item .nm{font-size:15px; font-weight:800; letter-spacing:-.01em}
.item .sub{font-size:12px; color:var(--ink-55); margin-top:2px}
.svcs{display:flex; gap:9px; margin-top:10px}
.svc{
  flex:1; border-radius:14px; padding:10px 12px; background:#fbfaff;
  box-shadow:inset 0 0 0 1.5px var(--ink-12); display:flex; align-items:center; gap:8px;
  min-height:52px;
}
.svc .lab{font-size:11.5px; font-weight:800; color:var(--ink-40); text-transform:uppercase; letter-spacing:.04em}
.svc .pr{font-size:15px; font-weight:900}
.svc.on{background:var(--grad-soft); box-shadow:inset 0 0 0 2px rgba(224,54,47,.35)}
.svc.on .lab{color:#b8322c}
.stepper{display:flex; align-items:center; gap:2px; margin-left:auto}
.stepper button{
  width:34px;height:34px;border-radius:11px;background:#fff;box-shadow:var(--sh-1);
  font-size:17px; font-weight:900; display:grid; place-items:center; color:var(--ink)
}
.stepper .q{min-width:26px; text-align:center; font-weight:900; font-size:15px}

/* ---------- list rows ---------- */
.lrow{display:flex; align-items:center; gap:13px; padding:14px 0; border-bottom:1px solid var(--ink-08); width:100%; text-align:left}
.lrow:last-child{border-bottom:0}
.lrow .ic{width:44px;height:44px;border-radius:14px;background:var(--grad-soft);display:grid;place-items:center;font-size:19px;flex:none}
.lrow .g{flex:1; min-width:0}
.lrow .t{font-size:14.5px; font-weight:800}
.lrow .s{font-size:12.5px; color:var(--ink-55); margin-top:1px}
.lrow .r{font-size:14px; font-weight:800; flex:none}
.pick{width:22px;height:22px;border-radius:50%;box-shadow:inset 0 0 0 2px var(--ink-12);flex:none;display:grid;place-items:center}
.pick.on{background:var(--grad); box-shadow:none}
.pick.on::after{content:''; width:8px;height:8px;border-radius:50%;background:#fff}

/* ---------- totals ---------- */
.tot{display:flex; justify-content:space-between; font-size:14px; padding:8px 0}
.tot.big{font-size:18px; font-weight:900; padding-top:14px; margin-top:6px; border-top:2px dashed var(--ink-12)}

/* ---------- bottom bar ---------- */
.cta-wrap{
  position:sticky; bottom:0; z-index:15; padding:12px 18px calc(env(safe-area-inset-bottom) + 12px);
  background:linear-gradient(180deg,rgba(251,247,243,0),var(--paper) 34%);
}
.nav{
  display:flex; z-index:15; background:var(--card); border-top:1px solid var(--ink-08);
  padding:8px 6px calc(env(safe-area-inset-bottom) + 8px);
}
.nav button{flex:1; padding:6px 2px; border-radius:14px; display:grid; gap:3px; justify-items:center; color:var(--ink-40)}
.nav button .i{font-size:19px; line-height:1}
.nav button .l{font-size:11px; font-weight:800}
.nav button.on{color:var(--red)}

/* ---------- token slip (signature) ---------- */
.slip{
  position:relative; background:#fff; border-radius:20px; box-shadow:var(--sh-2);
  overflow:hidden; margin-top:6px;
}
.slip .head{background:var(--grad); color:#fff; padding:20px 20px 24px; text-align:center}
.slip .head .k{font-size:11.5px; font-weight:800; letter-spacing:.16em; text-transform:uppercase; opacity:.85}
.slip .head .tok{font-size:44px; font-weight:900; letter-spacing:-.03em; line-height:1.05; margin-top:4px; font-variant-numeric:tabular-nums}
.perf{position:relative; height:22px; background:#fff}
.perf::before,.perf::after{
  content:''; position:absolute; top:0; width:22px; height:22px; border-radius:50%;
  background:var(--paper); transform:translateY(-50%);
}
.perf::before{left:-11px} .perf::after{right:-11px}
.perf .line{position:absolute; left:16px; right:16px; top:0; transform:translateY(-50%); border-top:2px dashed var(--ink-12)}
.slip .body{padding:4px 20px 20px}

/* ---------- timeline ---------- */
.step{display:flex; gap:13px}
.step .rail{display:flex; flex-direction:column; align-items:center; flex:none; width:22px}
.step .dot{width:14px;height:14px;border-radius:50%;background:var(--ink-12); flex:none}
.step .dot.on{background:var(--grad)}
.step .dot.now{box-shadow:0 0 0 5px rgba(224,54,47,.16)}
.step .bar{width:2px; flex:1; background:var(--ink-12); margin:3px 0}
.step .bar.on{background:var(--grad)}
.step .txt{padding-bottom:20px}
.step .txt .t{font-size:14.5px; font-weight:800}
.step .txt .s{font-size:12.5px; color:var(--ink-55)}
.step.off .txt .t{color:var(--ink-40)}

/* ---------- misc ---------- */
.badge{display:inline-flex; align-items:center; gap:6px; padding:5px 11px; border-radius:999px; font-size:11.5px; font-weight:800}
.badge.live{background:var(--grad); color:#fff}
.badge.done{background:rgba(13,148,136,.12); color:var(--teal)}
.note{background:var(--grad-soft); border-radius:var(--r-md); padding:12px 14px; font-size:13px; font-weight:600; color:#8f2a25}
.note.calm{background:rgba(124,58,237,.09); color:#5b21b6}
.qrbox{background:#fff; border-radius:18px; padding:14px; box-shadow:var(--sh-1); display:grid; place-items:center}
.qrbox canvas,.qrbox img{width:100%; max-width:250px; height:auto; display:block; border-radius:8px}
.toast{
  position:fixed; left:50%; bottom:calc(env(safe-area-inset-bottom) + 92px); transform:translateX(-50%);
  background:var(--ink); color:#fff; padding:12px 20px; border-radius:999px; font-size:13.5px; font-weight:700;
  z-index:60; box-shadow:var(--sh-2); max-width:90vw; text-align:center;
}
.sheet-bg{position:fixed; inset:0; background:rgba(34,28,46,.5); z-index:50; display:flex; align-items:flex-end; justify-content:center}
.sheet{background:var(--paper); width:100%; max-width:480px; border-radius:24px 24px 0 0; padding:20px 18px calc(env(safe-area-inset-bottom) + 20px); max-height:86dvh; overflow-y:auto}
.sheet h3{font-size:18px; font-weight:900; margin-bottom:4px}
.spin{width:18px;height:18px;border-radius:50%;border:2.5px solid rgba(255,255,255,.35);border-top-color:#fff;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.logo{height:34px; width:auto; display:block}
.center{text-align:center}
@media (max-width:380px){ body{font-size:15px} .top h1{font-size:20px} }
/* ---------- payment app grid ---------- */
.apps{display:grid; grid-template-columns:repeat(2,1fr); gap:9px; margin-top:12px}
.app{
  display:flex; align-items:center; gap:10px; text-decoration:none; color:var(--ink);
  background:var(--card); border-radius:14px; padding:11px 12px;
  box-shadow:inset 0 0 0 1.5px var(--ink-12); font-weight:800; font-size:13.5px;
}
.app:active{box-shadow:inset 0 0 0 2px var(--red)}
.app .m{
  width:30px; height:30px; border-radius:9px; flex:none; color:#fff;
  display:grid; place-items:center; font-size:14px; font-weight:900;
}
.app.wide{grid-column:1 / -1}

/* ---------- invoice ---------- */
.inv{background:#fff; border-radius:18px; box-shadow:var(--sh-2); overflow:hidden; margin-top:6px}
.inv .ihead{padding:18px 20px 16px; border-bottom:2px solid var(--ink-08)}
.inv .ihead .nm{font-size:18px; font-weight:900; letter-spacing:-.015em}
.inv .ihead .ad{font-size:12px; color:var(--ink-55); margin-top:3px}
.inv .meta{display:flex; justify-content:space-between; gap:14px; padding:12px 20px; background:var(--grad-soft)}
.inv .meta .k{font-size:10.5px; font-weight:800; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-55)}
.inv .meta .v{font-size:14px; font-weight:900; font-variant-numeric:tabular-nums}
.inv .ibody{padding:14px 20px 20px}
.itab{width:100%; border-collapse:collapse; font-size:13.5px}
.itab th{
  text-align:left; font-size:10.5px; letter-spacing:.08em; text-transform:uppercase;
  color:var(--ink-55); padding:6px 0; border-bottom:1.5px solid var(--ink-12); font-weight:800;
}
.itab td{padding:9px 0; border-bottom:1px solid var(--ink-08); vertical-align:top}
.itab .r{text-align:right; white-space:nowrap; font-variant-numeric:tabular-nums}
.itab .s{font-size:11.5px; color:var(--ink-55)}
.stamp{
  display:inline-flex; align-items:center; gap:7px; padding:7px 14px; border-radius:999px;
  font-size:12px; font-weight:900; letter-spacing:.04em; text-transform:uppercase;
}
.stamp.yes{background:rgba(13,148,136,.14); color:var(--teal)}
.stamp.no{background:rgba(224,54,47,.12); color:var(--red)}
.eline{display:grid; grid-template-columns:1fr 62px 78px; gap:8px; align-items:end}
.eline .input{min-height:42px; padding:8px 10px; font-size:15px; box-shadow:inset 0 0 0 1.5px var(--ink-12)}
.erow{padding:12px 0; border-bottom:1px solid var(--ink-08)}
.erow:last-child{border-bottom:0}

@media print{
  body{background:#fff}
  body::before{display:none}
  #app{box-shadow:none; max-width:none; background:#fff; min-height:0}
  .top,.nav,.cta-wrap,.noprint,.toast,.sheet-bg{display:none !important}
  .scroll{overflow:visible; padding:0}
  .pad{padding:0}
  .inv{box-shadow:none; border:1px solid #ccc; margin:0; border-radius:0}
  @page{margin:12mm}
}

    2:  [44,  16, [[1, 28]]],

    var bits = [];

      run = 1;

    for (i = 0; i < size - 1; i++) for (j = 0; j < size - 1; j++) {

      if (v === m[i][j + 1] && v === m[i + 1][j] && v === m[i + 1][j + 1]) p += 3;

    var bytes = utf8(text), v = 1;

      placeFormat(MM, size, mask);
      var sc = penalty(out, size);
      if (sc < bestScore) { bestScore = sc; best = out; }
    }
    return best;
  }

  return { encode: encode };

  var saved = LS.get('shop', {}) || {};

  ['upiId', 'upiName', 'upiMc', 'qrImage'].forEach(function (k) {

/* ==========================================================================
   Server link
   --------------------------------------------------------------------------
   Everything that matters — who is an owner, whether a PIN is right, whether

   ========================================================================== */
var API = {
  /* Same origin by default. Set window.PPL_API_BASE before this script if the
     app is served from somewhere other than the API. */
  base: String(window.PPL_API_BASE || '').replace(/\/+$/, ''),

  /* The step-up token lives in a plain variable and nowhere else: not
     localStorage, not sessionStorage, not a cookie. Closing the tab ends
     owner mode. */
  adminToken: null
};

function authHeaders(hasBody) {
  var h = { 'Accept': 'application/json' };
  if (hasBody) h['Content-Type'] = 'application/json';
  /* Login session is an HttpOnly cookie; JavaScript never reads the token. */
  if (API.adminToken) h['X-Admin-Token'] = API.adminToken;
  return h;
}

function apiError(code, message, extra) {
  var e = new Error(message || t('no_server'));
  e.code = code;
  if (extra) Object.assign(e, extra);
  return e;
}

function api(method, path, body) {
  return fetch(API.base + path, {
    method: method,
    headers: authHeaders(body !== undefined),
    credentials: 'same-origin',
    cache: 'no-store',
    body: body === undefined ? undefined : JSON.stringify(body)
  }).catch(function () {
    throw apiError('offline', t('no_server'));
  }).then(function (res) {
    return res.json().catch(function () { return {}; }).then(function (data) {
      if (res.ok) return data;

      /* A rejected session or a lapsed step-up is not an error to show — it
         is a state change to apply. */
      if (data.error === 'unauthenticated') { forceLogout(); }
      if (data.error === 'pin_required' || data.error === 'forbidden') { API.adminToken = null; }

      throw apiError(data.error || ('http_' + res.status),
        data.message || t('no_server'), { retryAfterSec: data.retryAfterSec });
    });
  });
}

/* One place to turn any thrown API error into something a customer can read. */
function apiToast(err) {
  if (!err) return;
  if (err.code === 'rate_limited' || err.code === 'locked' || err.code === 'otp_attempts') {
    toast(t('too_many'));
  } else {
    toast(err.message || t('no_server'));
  }
}

function vapidKeyBytes(base64Url) {
  var pad = '='.repeat((4 - base64Url.length % 4) % 4);
  var base64 = (base64Url + pad).replace(/-/g, '+').replace(/_/g, '/');
  var raw = atob(base64), out = new Uint8Array(raw.length);
  for (var i = 0; i < raw.length; i++) out[i] = raw.charCodeAt(i);
  return out;
}

async function ensurePushSubscription() {
  if (!('serviceWorker' in navigator) || !('PushManager' in window) || !('Notification' in window)) throw apiError('push_required', t('push_required'));
  var permission = Notification.permission;
  if (permission !== 'granted') permission = await Notification.requestPermission();
  if (permission !== 'granted') throw apiError('push_required', t('push_required'));
  var registration = await navigator.serviceWorker.register('/sw.js');
  var sub = await registration.pushManager.getSubscription();
  if (!sub) {
    var key = await api('GET', '/api/push/public-key');
    if (!key.publicKey) throw apiError('push_required', 'Push notifications are not configured on the server.');
    sub = await registration.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: vapidKeyBytes(key.publicKey) });
  }
  return sub.toJSON();
}

/* ---------- rate lookup ------------------------------------------------ */
function rateKey(catId, idx, kind) { return catId + '/' + idx + '/' + kind; }
function normaliseRateKeys(input) {
  var src = input && typeof input === 'object' ? input : {};
  var out = {};
  Object.keys(src).forEach(function (rawKey) {
    var key = String(rawKey).replace(/\./g, '/');
    if (!/^[a-z0-9_]+\/\d+\/(dc|si)$/i.test(key)) return;
    var value = src[rawKey];
    if (value === null || value === '') { out[key] = null; return; }
    var n = Number(value);
    if (Number.isFinite(n) && n >= 0 && n <= 1000000) out[key] = n;
  });
  return out;
}
function rateOf(catId, idx, kind, fallback) {
  var k = rateKey(catId, idx, kind);
  if (Object.prototype.hasOwnProperty.call(S.rates, k)) {
    var v = S.rates[k];
    return (v === '' || v === null) ? null : Number(v);
  }
  return fallback == null ? null : fallback;
}

  var l = S.cart[key]; if (!l) return;
  var q = l.qty + d;
  if (q <= 0) delete S.cart[key]; else S.cart[key] = Object.assign({}, l, { qty: q });
  LS.set('cart', S.cart);
}
function totals() {
  var sub = cartLines().reduce(function (a, l) { return a + l.price * l.qty; }, 0);
  var sh = S.shop;
  var drop = (S.mode === 'drop' && sub > 0) ? Number(sh.dropDiscount || 0) : 0;
  var fee = 0;
  if (S.mode === 'pickup' && sub > 0) fee = sub >= Number(sh.freeAbove || 0) ? 0 : Number(sh.pickupFee || 0);
  var taxable = Math.max(sub - drop, 0);
  var gst = taxable * (Number(sh.gstPct || 0) / 100);
  return { sub: sub, drop: drop, fee: fee, gst: gst, total: taxable + fee + gst };
}
function maxDays() {
  var v = cartLines();
  return v.length ? Math.max.apply(null, v.map(function (l) { return l.days || 2; })) : 2;
}

/* ---------- dates ------------------------------------------------------ */
var DOW = {
  en: ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'],
  hi: ['रवि', 'सोम', 'मंगल', 'बुध', 'गुरु', 'शुक्र', 'शनि'],
  pa: ['ਐਤ', 'ਸੋਮ', 'ਮੰਗਲ', 'ਬੁੱਧ', 'ਵੀਰ', 'ਸ਼ੁੱਕਰ', 'ਸ਼ਨੀ']
};
var MON = {
  en: ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'],
  hi: ['जन', 'फ़र', 'मार्च', 'अप्रैल', 'मई', 'जून', 'जुल', 'अग', 'सित', 'अक्तू', 'नव', 'दिस'],
  pa: ['ਜਨ', 'ਫ਼ਰ', 'ਮਾਰਚ', 'ਅਪ੍ਰੈ', 'ਮਈ', 'ਜੂਨ', 'ਜੁਲ', 'ਅਗ', 'ਸਤੰ', 'ਅਕਤੂ', 'ਨਵੰ', 'ਦਸੰ'] };

function dayList() {
  var out = [], now = new Date();
  for (var i = 0; i < 6; i++) {
    var d = new Date(now.getFullYear(), now.getMonth(), now.getDate() + i);
    out.push({
      d: d,
      dow: i === 0 ? t('today') : (i === 1 ? t('tomorrow') : DOW[S.lang][d.getDay()]),
      day: d.getDate(),
      mon: MON[S.lang][d.getMonth()]
    });
  }
  return out;
}
function fmtDate(d) { return DOW[S.lang][d.getDay()] + ', ' + d.getDate() + ' ' + MON[S.lang][d.getMonth()]; }
function readyBy() {
  var d = dayList()[S.dateIdx].d;
  return fmtDate(new Date(d.getFullYear(), d.getMonth(), d.getDate() + maxDays()));
}
var SLOTS = ['08:00 – 10:00', '10:00 – 12:00', '12:00 – 14:00', '14:00 – 16:00', '16:00 – 18:00', '18:00 – 20:00'];

/* ---------- addresses -------------------------------------------------- */
function addrById(id) {

function addrText(a) {

function telHref(num) { var d = digits(num); return d ? 'tel:+91' + d.slice(-10) : ''; }
function waHref(num, text) {

/* ---------- roles ------------------------------------------------------
   Two separate questions, deliberately not collapsed into one:

     isOwner()  the server matched this account against the admin allowlist
     isAdmin()  ...and the shop PIN has been entered in this tab

   Both are only ever hints for what to draw. Every write is checked again on
   the server, so a user who edits these in a console gets a 403, not a shop.
   ------------------------------------------------------------------------ */
function isOwner() {
  return !!(S.session && S.session.user && S.session.user.isAdmin === true);
}
function isAdmin() { return isOwner() && !!API.adminToken; }

/* ---------- paying ----------------------------------------------------- */
function upiQuery(amount, note) {
  var sh = S.shop;
  var q = 'pa=' + encodeURIComponent(sh.upiId) +
          '&pn=' + encodeURIComponent(sh.upiName || SHOP.name) +
          '&cu=INR';
  if (sh.upiMc) q += '&mc=' + encodeURIComponent(sh.upiMc);
  if (amount) q += '&am=' + Number(amount).toFixed(2);
  if (note) q += '&tn=' + encodeURIComponent(note);
  return q;
}
function upiLink(amount, note) {
  if (!S.shop.upiId) return '';
  return 'upi://pay?' + upiQuery(amount, note);
}

/* Every UPI app on the phone reads the same payment details; only the way
   the phone is asked to open them differs. Android honours an intent URL
   naming the package, everything else falls back to the app's own scheme. */
var PAY_APPS = [
  { id: 'any',     key: 'app_any', name: 'UPI',         letter: '₹', tint: 'var(--grad)',   pkg: null,                                          scheme: 'upi://pay?' },
  { id: 'phonepe', name: 'PhonePe',                     letter: 'P', tint: '#5f259f',       pkg: 'com.phonepe.app',                              scheme: 'phonepe://pay?' },
  { id: 'gpay',    name: 'Google Pay',                  letter: 'G', tint: '#1a73e8',       pkg: 'com.google.android.apps.nbu.paisa.user',       scheme: 'tez://upi/pay?' },
  { id: 'paytm',   name: 'Paytm',                       letter: 'P', tint: '#00b9f5',       pkg: 'net.one97.paytm',                              scheme: 'paytmmp://pay?' },
  { id: 'bhim',    name: 'BHIM',                        letter: 'B', tint: '#00639c',       pkg: 'in.org.npci.upiapp',                           scheme: 'bhim://pay?' },
  { id: 'amazon',  name: 'Amazon Pay',                  letter: 'a', tint: '#ff9900',       pkg: 'in.amazon.mShop.android.shopping',             scheme: 'upi://pay?' }
];
function isAndroid() { return /android/i.test(navigator.userAgent || ''); }
function isMobile() { return /android|iphone|ipad|ipod/i.test(navigator.userAgent || ''); }
function payHref(app, amount, note) {
  if (!S.shop.upiId) return '';
  var q = upiQuery(amount, note);
  if (app.pkg && isAndroid()) {
    return 'intent://pay?' + q + '#Intent;scheme=upi;package=' + app.pkg + ';end';
  }
  return app.scheme + q;
}
function payAppsHtml(amount, note) {
  return '<div class="apps">' + PAY_APPS.map(function (a) {
    var href = payHref(a, amount, note);
    if (!href) return '';
    var label = a.key ? t(a.key) : a.name;
    return '<a class="app' + (a.id === 'any' ? ' wide' : '') + '" href="' + esc(href) + '">' +
             '<span class="m" style="background:' + a.tint + '">' + esc(a.letter) + '</span>' +
             '<span>' + esc(label) + '</span>' +
           '</a>';
  }).join('') + '</div>';
}

/* ---------- invoice ---------------------------------------------------- */
function invNo(o) {
  var d = new Date(o.createdAt || Date.now());
  var yy = String(d.getFullYear()).slice(2);
  var mm = String(d.getMonth() + 1);
  if (mm.length < 2) mm = '0' + mm;
  return 'PPL-' + yy + mm + '-' + o.token;
}
function invTotals(inv) {
  var sub = (inv.lines || []).reduce(function (a, l) { return a + Number(l.price || 0) * Number(l.qty || 0); }, 0);
  var drop = Number(inv.drop || 0), fee = Number(inv.fee || 0), adj = Number(inv.adjust || 0);
  var taxable = Math.max(sub - drop, 0);
  var gst = taxable * (Number(inv.gstPct || 0) / 100);
  return { sub: sub, drop: drop, fee: fee, gst: gst, adj: adj, total: taxable + fee + gst + adj };
}
/* Orders placed before bills existed still get one, built from what was saved. */
function ensureInvoice(o) {
  if (!o) return null;
  if (!o.invoice) {
    var lines = (o.items || []).map(function (l) {
      return { name: l.name, meta: l.meta || '', qty: Number(l.qty) || 1, unit: l.unit || '', price: Number(l.price) || 0 };
    });
    var sub = lines.reduce(function (a, l) { return a + l.price * l.qty; }, 0);
    o.invoice = {
      no: invNo(o), date: o.createdAt || Date.now(),
      name: S.customer.name, phone: S.customer.phone, addr: o.addrText || '',
      lines: lines, fee: 0, drop: 0, gstPct: 0,
      adjust: Math.round((Number(o.total) || sub) - sub), adjustNote: '',
      paid: false, note: ''
    };
  }
  if (!o.invoice.lines) o.invoice.lines = [];
  return o.invoice;
}
function saveOrders() {
  LS.set('orders', S.orders);
}
function billText(o) {
  var inv = ensureInvoice(o), T = invTotals(inv);
  var L = [SHOP.name, t('inv_no') + ' ' + inv.no, t('token') + ' ' + o.token, ''];
  inv.lines.forEach(function (l) {
    L.push(l.name + '  ' + (l.unit ? l.qty + ' ' + l.unit : 'x' + l.qty) + '  ' + money(l.price * l.qty));
  });
  L.push('', t('total') + ': ' + money(T.total), inv.paid ? t('paid') : t('unpaid'));
  return L.join('\n');
}
function waShare(text) {
  return 'https://wa.me/?text=' + encodeURIComponent(text);
}
function fmtStamp(ms) {
  var d = new Date(ms || Date.now());
  return d.getDate() + ' ' + MON[S.lang][d.getMonth()] + ' ' + d.getFullYear();
}

/* ---------- where the customer left off -------------------------------- */
function isoOf(d) {
  var m = String(d.getMonth() + 1), day = String(d.getDate());
  if (m.length < 2) m = '0' + m;
  if (day.length < 2) day = '0' + day;
  return d.getFullYear() + '-' + m + '-' + day;
}
function saveNav() {
  var list = dayList(), d = list[S.dateIdx] || list[0];
  LS.set('nav', {
    screen: S.screen, cat: S.cat, mode: S.mode,
    dateISO: d ? isoOf(d.d) : '',
    slot: S.slot, method: S.method, kg: S.kg, kgService: S.kgService,
    pieces: S.pieces, pressKind: S.pressKind,
    order: S.viewOrder ? S.viewOrder.id : ''
  });
}
/* A reload should land where the customer was, but only where that still
   makes sense: an empty bag or a missing order sends them somewhere real. */
function restoreNav() {
  var n = LS.get('nav', null);
  if (!n) return;
  if (n.cat) S.cat = n.cat;
  if (n.mode === 'pickup' || n.mode === 'drop') S.mode = n.mode;
  if (n.slot && SLOTS.indexOf(n.slot) >= 0) S.slot = n.slot;
  if (n.method === 'cod' || n.method === 'upi') S.method = n.method;
  if (n.kgService === 'fold' || n.kgService === 'press') S.kgService = n.kgService;
  if (n.kg) S.kg = Math.max(1, Math.min(30, Number(n.kg) || 4));
  if (n.pieces) S.pieces = Math.max(1, Math.min(99, Number(n.pieces) || 5));
  if (n.pressKind === 'plain' || n.pressKind === 'steam') S.pressKind = n.pressKind;
  if (n.dateISO) {
    var list = dayList();
    for (var i = 0; i < list.length; i++) {
      if (isoOf(list[i].d) === n.dateISO) { S.dateIdx = i; break; }
    }
  }
  if (n.order) {
    S.viewOrder = S.orders.filter(function (o) { return o.id === n.order; })[0] || null;
  }
  var sc = n.screen;
  if (!sc || !SCREENS[sc] || sc === 'auth') return;
  if (sc === 'addrform') sc = S.addresses.length ? 'address' : 'home';
  if ((sc === 'slip' || sc === 'track' || sc === 'invoice' || sc === 'editinvoice') && !S.viewOrder) {
    sc = S.orders.length ? 'orders' : 'home';
  }
  if ((sc === 'shop' || sc === 'editrates' || sc === 'editinvoice') && !isAdmin()) sc = 'home';
  if ((sc === 'cart' || sc === 'schedule' || sc === 'address' || sc === 'payment') && !cartLines().length) sc = 'home';
  S.screen = sc;
}

      var plus = (p[0] === 'dc' ? it.fd : it.fs) ? '+' : '';
      svc +=
        `<div class="svc ${qty ? 'on' : ''}">
           <div>
             <div class="lab">${esc(p[2])}</div>
             <div class="pr">${esc(money(p[1]))}${plus}${it.u ? '<small style="font-size:10px">/' + esc(tn(it.u)) + '</small>' : ''}</div>
           </div>
           <div class="stepper">
             ${qty ? `<button data-a="dec" data-v="${esc(key)}" aria-label="less">−</button><span class="q">${qty}</span>` : ''}
             <button data-a="add" data-v="${esc(cat.id + '|' + i + '|' + p[0])}" aria-label="add">+</button>
           </div>
         </div>`;
    });
    /* No price set means the shop does not offer it yet — leave it off the
       card entirely rather than showing a name nobody can tap. */
    if (!svc) return '';
    return `<div class="item"><div class="nm">${esc(tn(it.n))}</div><div class="svcs">${svc}</div></div>`;
  }).join('');

  var custom = Object.keys(S.rates).length > 0;
  var anyPlus = cat.items.some(function (it) { return it.fd || it.fs; });
  var body =
    `<div class="scrollx" style="margin:14px -18px 0">${chips}</div>
     <div class="row" style="margin-top:12px;align-items:center;gap:8px">
       <span class="badge done">🕑 ${esc(t('days_line').replace('DAYS', cat.days))}</span>
     </div>

     ${custom ? '' : `<div class="note" style="margin-top:12px">${esc(t('sample_rates'))}</div>`}
     <div class="card" style="margin-top:14px">${rows}</div>`;

  return {
    top: { eyebrow: t('per_piece'), title: t('rate_card'), lang: true },
    body: body, nav: true, cta: ctaBag()
  };
};

  var rows = inv.lines.map(function (l) {
    return `<tr>
      <td><div style="font-weight:700">${esc(l.name)}</div>

      <td class="r" style="font-weight:800">${esc(money(l.price * l.qty))}</td>

  }).join('');

  var line = function (label, value, cls) {
    return `<div class="tot"${cls ? ` style="color:${cls}"` : ''}><span>${esc(label)}</span><span>${value}</span></div>`;
  };

  var paidStamp = inv.paid
    ? `<span class="stamp yes">✓ ${esc(t('paid'))}</span>`
    : `<span class="stamp no">● ${esc(t('unpaid'))}</span>`;

  var body =
    `<div class="inv">
       <div class="ihead">
         <div class="nm">${esc(SHOP.name)}</div>
         <div class="ad">${esc(SHOP.line1)}<br>${esc(SHOP.line2)}</div>
         ${sh.phone ? `<div class="ad">${esc(t('call'))}: +91 ${esc(sh.phone)}</div>` : ''}

       <div class="meta">
         <div><div class="k">${esc(t('inv_no'))}</div><div class="v">${esc(inv.no)}</div></div>
         <div style="text-align:right"><div class="k">${esc(t('inv_date'))}</div><div class="v">${esc(fmtStamp(inv.date))}</div></div>
       </div>
       <div class="ibody">
         <div class="k tiny" style="font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-55)">${esc(t('bill_to'))}</div>
         <div style="font-weight:800;margin-top:2px">${esc(inv.name || t('cust_name'))}</div>
         ${inv.phone ? `<div class="muted" style="font-size:13px">+91 ${esc(inv.phone)}</div>` : ''}
         ${inv.addr ? `<div class="muted" style="font-size:13px">${esc(inv.addr)}</div>` : ''}
         <div class="tiny" style="margin-top:6px">${esc(t('token'))} ${esc(o.token)} · ${esc(t('ready_by'))} ${esc(o.readyBy)}</div>

         <table class="itab" style="margin-top:16px">
           <thead><tr>
             <th>${esc(t('col_item'))}</th>
             <th class="r">${esc(t('col_qty'))}</th>
             <th class="r">${esc(t('col_amount'))}</th>
           </tr></thead>
           <tbody>${rows}</tbody>
         </table>

         <div style="margin-top:10px">
           ${line(t('items_total'), esc(money(T.sub)))}
           ${T.drop ? line(t('shop_drop'), '− ' + esc(money(T.drop)), 'var(--teal)') : ''}
           ${T.fee ? line(t('pickup_charge'), esc(money(T.fee))) : ''}
           ${T.gst ? line(t('gst') + ' ' + inv.gstPct + '%', esc(money(T.gst))) : ''}
           ${T.adj ? line(inv.adjustNote || t('adjustment'), (T.adj < 0 ? '− ' : '+ ') + esc(money(Math.abs(T.adj))), T.adj < 0 ? 'var(--teal)' : '') : ''}

         </div>

         <div style="margin-top:14px">${paidStamp}</div>
         <div class="tiny" style="margin-top:12px">${esc(inv.note || t('bill_thanks'))}</div>
       </div>
     </div>

       <a class="btn line sm" href="${esc(waShare(billText(o)))}" style="margin-top:10px;text-decoration:none;display:block;text-align:center">${esc(t('send_bill'))}</a>
       ${isAdmin() ? `

    top: { back: 'track', eyebrow: t('token') + ' ' + o.token, title: t('invoice'), lang: true },
    nav: false, body: body

function drawQRs() {
  var list = document.querySelectorAll('canvas[data-qr]');
  for (var i = 0; i < list.length; i++) {
    var cv = list[i], text = cv.getAttribute('data-qr');
    try {
      var m = QR.encode(text), n = m.length, quiet = 4, total = n + quiet * 2;
      var px = Math.max(4, Math.floor(cv.width / total));
      cv.width = cv.height = total * px;
      var ctx = cv.getContext('2d');
      ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, cv.width, cv.height);
      ctx.fillStyle = '#14101c';
      for (var r = 0; r < n; r++) for (var c = 0; c < n; c++)
        if (m[r][c]) ctx.fillRect((c + quiet) * px, (r + quiet) * px, px, px);
    } catch (e) {
      cv.parentNode.innerHTML = '<div class="tiny center">' + esc(text) + '</div>';
    }
  }
}

/* --- login / registration --- */
function authEmailValue() {
  return String(fv('authEmail') || S.authEmail || '').trim().toLowerCase();
}
function normaliseAuthPhone(value) {
  var p = digits(value || '');
  if (p.length === 12 && p.slice(0, 2) === '91') p = p.slice(2);
  if (p.length === 11 && p.charAt(0) === '0') p = p.slice(1);
  return p;
}
function authPhoneValue() {
  return normaliseAuthPhone(fv('authPhone') || S.authPhone || '');
}
function validAuthEmail(email) {
  return /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(String(email || ''));
}
function validAuthPhone(phone) {
  return /^[6-9]\d{9}$/.test(normaliseAuthPhone(phone));
}
function cleanAuthIdentifier(value) {
  var raw = String(value || '').trim();
  if (validAuthEmail(raw)) return raw.toLowerCase();
  var phone = normaliseAuthPhone(raw);
  if (validAuthPhone(phone)) return phone;
  return '';
}
function authIdentifierValue() {
  return String(fv('authIdentifier') || S.authIdentifier || S.customer.email || S.customer.phone || '').trim();
}
function enterOtpStep(identifier, r) {
  S.authIdentifier = (r && r.identifier) || identifier;
  S.authStep = 'otp';
  S.otpExpiresAt = Date.now() + ((r && r.expiresInSec) || 120) * 1000;
  S.otpResendAt = Date.now() + ((r && r.resendAfterSec) || 30) * 1000;
  S.authErr = '';
  render();
  startOtpClock();
}
ACT.goRegister = function () {
  S.authStep = 'register';
  S.authErr = '';
  S.authName = S.customer.name || S.authName || '';
  S.authEmail = S.customer.email || S.authEmail || '';
  S.authPhone = S.customer.phone || S.authPhone || '';
  render();
};
ACT.goLogin = function () {
  S.authStep = 'login';
  S.authErr = '';
  if (!S.authIdentifier) S.authIdentifier = S.customer.email || S.customer.phone || '';
  render();
};
ACT.authBack = ACT.goLogin;
ACT.sendOtp = function () {
  var identifier = cleanAuthIdentifier(authIdentifierValue());
  if (!identifier) {
    S.authErr = t('bad_identifier');
    render();
    return;
  }
  if (S.busy) return;
  if (S.authStep === 'otp' && Date.now() < S.otpResendAt) return;

  S.authIdentifier = identifier;
  S.authErr = '';
  S.busy = true;
  render();

  api('POST', '/api/auth/request-otp', { identifier: identifier })
    .then(function (r) {
      S.busy = false;
      enterOtpStep(identifier, r);
    })
    .catch(function (err) {
      S.busy = false;
      if (err.code === 'cooldown' && err.retryAfterSec) {
        S.otpResendAt = Date.now() + err.retryAfterSec * 1000;
        S.authStep = 'otp';
      } else {
        S.authErr = err.code === 'account_not_found'
          ? t('account_not_found')
          : (err.code === 'bad_identifier' ? t('bad_identifier')
          : (err.code === 'rate_limited' ? t('too_many') : err.message));
      }
      render();
    });
};
ACT.registerAccount = function () {
  var name = String(fv('authName') || '').trim();
  var email = String(fv('authEmail') || '').trim().toLowerCase();
  var rawPhone = String(fv('authPhone') || '').trim();
  var phone = rawPhone ? normaliseAuthPhone(rawPhone) : '';

  if (!name) {
    S.authErr = t('bad_name');
    render();
    return;
  }
  if (!email && !rawPhone) {
    S.authErr = t('identifier_required');
    render();
    return;
  }
  if (email && !validAuthEmail(email)) {
    S.authErr = t('bad_email');
    render();
    return;
  }
  if (rawPhone && !validAuthPhone(phone)) {
    S.authErr = t('bad_mobile');
    render();
    return;
  }
  if (S.busy) return;

  S.authName = name;
  S.authEmail = email;
  S.authPhone = phone;
  S.authErr = '';
  S.busy = true;
  render();

  ensurePushSubscription()
    .then(function (subscription) {
      return api('POST', '/api/auth/register', {
        name: name,
        email: email,
        phone: phone,
        subscription: subscription
      });
    })
    .then(function (r) {
      S.customer.name = r.user.name || name;
      S.customer.email = r.user.email || '';
      S.customer.phone = r.user.phone || '';
      LS.set('customer', S.customer);
      var identifier = r.loginIdentifier || r.user.email || r.user.phone;
      S.authIdentifier = identifier;
      return api('POST', '/api/auth/request-otp', { identifier: identifier });
    })
    .then(function (r) {
      S.busy = false;
      enterOtpStep(S.authIdentifier, r);
    })
    .catch(function (err) {
      S.busy = false;
      S.authErr = err.code === 'push_required' ? t('push_required')
        : (err.code === 'identifier_required' ? t('identifier_required')
        : (err.code === 'bad_identifier' ? t('bad_identifier') : err.message));
      render();
    });
};
var otpClock = null;
function startOtpClock() {
  clearInterval(otpClock);
  otpClock = setInterval(tickOtpClock, 500);
  tickOtpClock();
}
function tickOtpClock() {
  if (S.authStep !== 'otp') {
    clearInterval(otpClock);
    return;
  }
  var el = document.getElementById('otp_clock'), btn = document.getElementById('otp_resend');
  if (!el) return;
  var left = Math.max(0, S.otpExpiresAt - Date.now());
  if (left <= 0) el.textContent = t('code_expired');
  else {
    var sec = Math.ceil(left / 1000);
    el.textContent = t('code_valid') + ' ' + Math.floor(sec / 60) + ':' + String(sec % 60).padStart(2, '0');
  }
  if (btn) {
    var wait = Math.ceil(Math.max(0, S.otpResendAt - Date.now()) / 1000);
    btn.disabled = wait > 0;
    btn.style.opacity = wait > 0 ? '.5' : '';
    btn.textContent = wait > 0 ? t('resend_in') + ' ' + wait + t('seconds_short') : t('resend');
  }
}
ACT.verifyOtp = function () {
  if (S.busy) return;
  var code = digits(fv('otp'));
  if (code.length !== 4) {
    S.authErr = t('wrong_code');
    render();
    return;
  }
  S.busy = true;
  S.authErr = '';
  render();
  api('POST', '/api/auth/verify-otp', { identifier: S.authIdentifier, code: code })
    .then(function (r) {
      S.busy = false;
      clearInterval(otpClock);
      setSession(r.user);
      finishLogin();
    })
    .catch(function (err) {
      S.busy = false;
      S.authErr = err.code === 'otp_expired' ? t('code_expired')
        : (err.code === 'otp_wrong' ? t('wrong_code') : err.message);
      render();
    });
};

function setSession(user) {
  S.session = { user: user };
  S.customer.name = user.name || '';

  S.authName = S.customer.name;
  LS.set('customer', S.customer);

/* --- geolocation --- */
function insecurePage() {
  // Browsers only hand out location on https:// (or localhost). Opened as a
  // downloaded file — file:// or content:// — the request is refused outright.
  if (typeof isSecureContext === 'boolean') return !isSecureContext;
  return location.protocol !== 'https:' && location.hostname !== 'localhost' && location.hostname !== '127.0.0.1';
}

ACT.useLocation = function () {
  if (!navigator.geolocation) { S.geoMsg = { ok: false, text: t('loc_unavail') }; render(); return; }
  if (insecurePage()) { S.geoMsg = { ok: false, text: t('loc_insecure') }; render(); return; }
  S.editAddr = Object.assign({}, S.editAddr, readAddrForm());
  S.geoBusy = true; S.geoMsg = ''; render();

  navigator.geolocation.getCurrentPosition(function (pos) {
    var lat = pos.coords.latitude, lng = pos.coords.longitude;
    S.editAddr = Object.assign({}, S.editAddr, { lat: lat.toFixed(6), lng: lng.toFixed(6) });

    var url = 'https://nominatim.openstreetmap.org/reverse?format=jsonv2&zoom=18&addressdetails=1&lat=' + lat + '&lon=' + lng;
    var done = false;
    var finish = function (msg) {
      if (done) return; done = true;
      S.geoBusy = false; S.geoMsg = msg; render();
    };
    setTimeout(function () { finish({ ok: true, text: t('loc_fail') }); }, 9000);

    fetch(url, { headers: { 'Accept': 'application/json' } })
      .then(function (r) { return r.json(); })
      .then(function (j) {
        var a = j.address || {};
        var e = S.editAddr;
        e.house = e.house || a.house_number || '';
        e.street = e.street || [a.road, a.neighbourhood, a.suburb].filter(Boolean).join(', ');
        e.city = a.village || a.town || a.city || a.county || e.city || '';
        e.pin = a.postcode || e.pin || '';
        finish({ ok: true, text: t('loc_ok') });
      })
      .catch(function () { finish({ ok: true, text: t('loc_fail') }); });
  }, function (err) {
    var key = err && err.code === 1 ? 'loc_denied'
            : err && err.code === 3 ? 'loc_timeout'
            : 'loc_unavail';
    S.geoBusy = false; S.geoMsg = { ok: false, text: t(key) }; render();
  }, { enableHighAccuracy: true, timeout: 12000, maximumAge: 0 });
};

/* --- payment + order --- */
ACT.setMethod = function (v) { S.method = v; render(); };
ACT.copyUpi = function () {
  var txt = S.shop.upiId;
  if (navigator.clipboard) navigator.clipboard.writeText(txt).then(function () { toast(t('copied')); });
  else toast(txt);
};
ACT.toPayment = function () {
  if (!S.addresses.length) { S.authErr = t('need_address'); render(); return; }
  if (!S.addrId) S.addrId = S.addresses[0].id;
  go('payment');
};
ACT.placeOrder = function () {
  if (S.busy) return;
  var T = totals(), a = currentAddr();
  var o = {
    items: cartLines().map(function (l) {
      return { name: l.name, meta: l.meta, qty: l.qty, unit: l.unit, price: l.price };
    }),
    total: T.total, mode: S.mode,
    dateLabel: fmtDate(dayList()[S.dateIdx].d),
    slot: S.slot || SLOTS[1],
    readyBy: readyBy(),
    addrText: S.mode === 'pickup' ? addrText(a) : SHOP.line1 + ', ' + SHOP.line2,
    paidVia: S.method === 'cod' ? t('cod') : t('upi'),
    status: 0
  };
  o.invoice = {
    no: invNo(o), date: o.createdAt,
    name: S.customer.name, phone: S.customer.phone,
    addr: S.mode === 'pickup' ? addrText(a) : '',
    lines: cartLines().map(function (l) {
      return { name: l.name, meta: l.meta, qty: l.qty, unit: l.unit || '', price: l.price };
    }),
    fee: T.fee, drop: T.drop, gstPct: Number(S.shop.gstPct || 0),
    adjust: 0, adjustNote: '', paid: false, note: ''
  };
  /* The token number and the order id are the server's to assign — two
     phones ordering at once must not both get token 101. */
  S.busy = true; render();
  api('POST', '/api/orders', { order: o }).then(function (r) {
    S.busy = false;
    S.orders.unshift(r.order);
    saveOrders();
    S.cart = {}; LS.set('cart', {});
    S.viewOrder = r.order;
    go('slip');
  }).catch(function (err) {
    S.busy = false; apiToast(err); render();
  });
};
ACT.openOrder = function (v) {
  S.viewOrder = S.orders.filter(function (o) { return o.id === v; })[0] || null;
  go('track');
};
ACT.nextStage = function (v) {
  if (!isAdmin()) return;
  var o = S.orders.filter(function (x) { return x.id === v; })[0];
  if (!o) return;
  ACT.setStage(v + ':' + Math.min(5, o.status + 1));
};
ACT.setStage = function (v) {
  if (!isAdmin()) return;
  var p = String(v).split(':'), id = p[0], n = Math.max(0, Math.min(5, Number(p[1])));

  /* Local state moves only after the server has accepted the change, so the
     screen can never show a stage the shop's records do not have. */
  api('PATCH', '/api/admin/orders/' + encodeURIComponent(id) + '/status', { status: n })
    .then(function (r) { replaceOrder(r.order); render(); })
    .catch(function (err) { apiToast(err); render(); });
};

function replaceOrder(order) {
  if (!order) return;
  var found = false;
  S.orders = S.orders.map(function (o) {
    if (o.id === order.id) { found = true; return order; }
    return o;
  });
  if (!found) S.orders.unshift(order);
  saveOrders();
  if (S.viewOrder && S.viewOrder.id === order.id) S.viewOrder = order;
}

/* --- owner mode --- */
ACT.openPin = function () {
  /* The allowlist check that counts happens on the server. This one only
     avoids showing a PIN box to someone who could never pass it anyway. */
  if (!isOwner()) { toast(t('not_owner')); return; }
  S.sheet = 'pin'; S.pinErr = ''; render();
};
ACT.tryPin = function () {
  if (S.busy) return;
  var v = digits(fv('pin'));
  if (!v) { S.pinErr = t('wrong_pin'); render(); return; }
  S.busy = true; S.pinErr = ''; render();

  /* The PIN leaves the field, goes to the server, and is compared against a
     scrypt hash there. Nothing in this file knows what it is. */
  api('POST', '/api/admin/pin/verify', { pin: v }).then(function (r) {
    S.busy = false;
    API.adminToken = r.adminToken;       /* memory only */
    S.sheet = null; S.pinErr = '';
    toast(t('owner_mode'));
    syncFromServer();
  }).catch(function (err) {
    S.busy = false;
    S.pinErr = err.code === 'pin_wrong' ? t('wrong_pin')
      : (err.code === 'forbidden' ? t('not_owner')
      : (err.code === 'locked' ? t('too_many') : err.message));
    render();
  });
};
ACT.changePin = function () {
  if (S.busy) return;
  var cur = digits(fv('currentPin')), next = digits(fv('newPin'));

  if (cur.length < 4 || cur.length > 8 || next.length < 4 || next.length > 8) {
    toast(t('wrong_pin'));
    return;
  }

  S.busy = true; render();
  api('POST', '/api/admin/pin/change', { currentPin: cur, newPin: next }).then(function () {
    S.busy = false;

    /* The server revokes every admin step-up token when the PIN changes.
       Drop this tab's copy immediately too, then require the new PIN. */
    API.adminToken = null;
    S.sheet = null;
    S.pinErr = '';
    S.screen = 'account';

    toast(t('pin_changed'));
    render();
  }).catch(function (err) {
    S.busy = false; apiToast(err); render();
  });
};
ACT.exitOwner = function () {
  API.adminToken = null;
  if (S.screen === 'shop' || S.screen === 'editrates' || S.screen === 'editinvoice') S.screen = 'account';
  render();
};

/* --- bill --- */
ACT.openInvoice = function (v) {
  var o = S.orders.filter(function (x) { return x.id === v; })[0];
  if (!o) return;
  S.viewOrder = o;
  ensureInvoice(o); saveOrders();
  go('invoice');
};
ACT.editInvoice = function (v) {
  if (!isAdmin()) return;
  var o = S.orders.filter(function (x) { return x.id === v; })[0];
  if (!o) return;
  S.viewOrder = o; ensureInvoice(o);
  go('editinvoice');
};
ACT.printBill = function () { window.print(); };
ACT.togglePaid = function (v) {
  if (!isAdmin() || S.busy) return;
  var o = S.orders.filter(function (x) { return x.id === v; })[0];
  if (!o) return;
  if (S.screen === 'editinvoice') harvestInvoice();
  var inv = ensureInvoice(o);
  var next = Object.assign({}, inv, { paid: !inv.paid });
  S.busy = true;
  api('PUT', '/api/admin/orders/' + encodeURIComponent(o.id) + '/invoice', { invoice: next })
    .then(function (r) { S.busy = false; replaceOrder(r.order); render(); })
    .catch(function (err) { S.busy = false; apiToast(err); render(); });
};
/* Read every box on the editor back into the bill before anything moves. */
function harvestInvoice() {
  var o = S.viewOrder; if (!o) return;
  var inv = ensureInvoice(o);
  var els = document.querySelectorAll('[data-i]');
  for (var i = 0; i < els.length; i++) {
    var idx = Number(els[i].getAttribute('data-i'));
    var k = els[i].getAttribute('data-k');
    var val = els[i].value;
    var line = inv.lines[idx];
    if (!line) continue;
    if (k === 'name') line.name = val.trim();
    else if (k === 'qty') line.qty = Math.max(0, Number(val) || 0);
    else if (k === 'price') line.price = Math.max(0, Number(val) || 0);
  }
  ['fee', 'drop', 'gstPct', 'adjust'].forEach(function (k) {
    var el = document.querySelector('[data-b="' + k + '"]');
    if (el) inv[k] = Number(el.value) || 0;
  });
  ['name', 'phone', 'adjustNote', 'note'].forEach(function (k) {
    var el = document.querySelector('[data-b="' + k + '"]');
    if (el) inv[k] = k === 'phone' ? digits(el.value) : el.value.trim();
  });
}
ACT.addLine = function () {
  if (!isAdmin()) return;
  harvestInvoice();
  var inv = ensureInvoice(S.viewOrder);
  inv.lines.push({ name: t('new_line'), meta: '', qty: 1, unit: '', price: 0 });
  render();
};
ACT.delLine = function (v) {
  if (!isAdmin()) return;
  harvestInvoice();
  var inv = ensureInvoice(S.viewOrder);
  inv.lines.splice(Number(v), 1);
  render();
};
ACT.saveInvoice = function () {
  if (!isAdmin() || S.busy) return;
  harvestInvoice();
  var o = S.viewOrder, inv = ensureInvoice(o);
  S.busy = true;
  api('PUT', '/api/admin/orders/' + encodeURIComponent(o.id) + '/invoice',
      { invoice: inv, total: invTotals(inv).total })
    .then(function (r) {
      S.busy = false;
      replaceOrder(r.order);
      toast(t('bill_saved'));
      go('invoice');
    })
    .catch(function (err) { S.busy = false; apiToast(err); render(); });
};

/* --- account + shop --- */
ACT.saveProfile = function () {
  var n = fv('name');
  var e = String(fv('email') || '').trim().toLowerCase();
  var rawPhone = String(fv('profilePhone') || '').trim();
  var phone = rawPhone ? normaliseAuthPhone(rawPhone) : '';
  if (!n) { toast(t('bad_name')); return; }
  if (!e && !rawPhone) { toast(t('identifier_required')); return; }
  if (e && !validAuthEmail(e)) { toast(t('bad_email')); return; }
  if (rawPhone && !validAuthPhone(phone)) { toast(t('bad_mobile')); return; }
  if (S.busy) return;
  S.busy = true;
  render();
  api('POST', '/api/me', { name: n, email: e, phone: phone })
    .then(function (r) {
      S.busy = false;
      setSession(r.user);
      toast(t('saved'));
      render();
    })
    .catch(function (err) {
      S.busy = false;
      apiToast(err);
      render();
    });
};
ACT.saveShop = function () {
  if (!isAdmin() || S.busy) return;
  ['phone', 'whatsapp', 'upiId', 'upiName'].forEach(function (k) {
    var el = document.querySelector('[data-f="' + k + '"]');
    if (el) S.shop[k] = (k === 'phone' || k === 'whatsapp') ? digits(el.value) : el.value.trim();
  });
  ['pickupFee', 'freeAbove', 'dropDiscount', 'gstPct', 'kgFold', 'kgPress',
   'pressPlain', 'pressSteam'].forEach(function (k) {
    var el = document.querySelector('[data-f="' + k + '"]');
    if (el) S.shop[k] = Number(el.value) || 0;
  });
  pushShop();
};

/* Send the shop's settings up. The uploaded QR photo travels as a marker
   when it is the one this app ships with, so the picture is not re-uploaded
   on every save. */
function pushShop() {
  var payload = Object.assign({}, S.shop);
  if (payload.qrImage === ASSET.qrPoster) payload.qrImage = '@default';
  delete payload.adminPin;
  S.busy = true;
  api('PUT', '/api/admin/shop', { shop: payload }).then(function () {
    S.busy = false;
    saveShopLS();
    toast(t('saved'));
    render();
  }).catch(function (err) { S.busy = false; apiToast(err); render(); });
}

ACT.removeQr = function () { if (!isAdmin()) return; S.shop.qrImage = ''; pushShop(); };
ACT.resetQr = function () { if (!isAdmin()) return; S.shop.qrImage = ASSET.qrPoster; pushShop(); };

function harvestRates() {
  var els = document.querySelectorAll('[data-r]');
  for (var i = 0; i < els.length; i++) {
    var k = els[i].getAttribute('data-r'), val = els[i].value.trim();
    S.rates[k] = val === '' ? null : Number(val);
  }
}
ACT.saveRates = function () {
  if (!isAdmin() || S.busy) return;
  harvestRates();
  pushRates(function () { go('shop'); });
};
ACT.resetRates = function () {
  if (!isAdmin() || S.busy) return;
  S.rates = {};
  pushRates(function () { render(); });
};

function pushRates(done) {
  S.busy = true;
  var payload = normaliseRateKeys(S.rates);
  api('PUT', '/api/admin/rates', { rates: payload }).then(function (r) {
    /* The response is the copy MongoDB actually accepted and stored. */
    S.rates = normaliseRateKeys(r.rates || {});
    return api('GET', '/api/shop?rates=' + Date.now());
  }).then(function (fresh) {
    S.busy = false;
    S.rates = normaliseRateKeys(fresh.rates || {});
    toast(t('saved'));
    done();
  }).catch(function (err) { S.busy = false; apiToast(err); render(); });
}

/* ==========================================================================
   Wiring
   ========================================================================== */
document.getElementById('app').addEventListener('click', function (ev) {
  var stop = ev.target.closest('[data-stop]');
  var el = ev.target.closest('[data-a]');
  if (!el) return;
  if (el.tagName === 'A' || el.tagName === 'INPUT') return;
  if (el.getAttribute('data-a') === 'closeSheet' && stop) return;
  ev.preventDefault();
  var fn = ACT[el.getAttribute('data-a')];
  if (fn) fn(el.getAttribute('data-v'));
});

document.getElementById('app').addEventListener('change', function (ev) {
  var el = ev.target;
  if (el.getAttribute('data-a') !== 'uploadQr') return;
  var f = el.files && el.files[0];
  if (!f) return;
  var rd = new FileReader();
  rd.onload = function () {
    var img = new Image();
    img.onload = function () {
      var max = 640, w = img.width, h = img.height;
      var sc = Math.min(1, max / Math.max(w, h));
      var cv = document.createElement('canvas');
      cv.width = Math.round(w * sc); cv.height = Math.round(h * sc);
      cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
      S.shop.qrImage = cv.toDataURL('image/jpeg', 0.82);
      if (!saveShopLS()) { S.shop.qrImage = ''; toast('Photo too large'); }
      render();
    };
    img.src = rd.result;
  };
  rd.readAsDataURL(f);
});

/* Enter key submits the obvious action on single-field screens */
document.getElementById('app').addEventListener('keydown', function (ev) {
  if (ev.key !== 'Enter') return;
  var f = ev.target.getAttribute && ev.target.getAttribute('data-f');
  if (f === 'authIdentifier' && S.authStep === 'login') { ev.preventDefault(); ACT.sendOtp(); }
  if ((f === 'authEmail' || f === 'authPhone' || f === 'authName') && S.authStep === 'register') { ev.preventDefault(); ACT.registerAccount(); }
  if (f === 'otp') { ev.preventDefault(); ACT.verifyOtp(); }
  if (f === 'pin') { ev.preventDefault(); ACT.tryPin(); }
});

/* Installable web-app manifest, built at runtime so the file stays standalone */
(function () {
  try {
    var m = {
      name: SHOP.name, short_name: 'Prem Laundry',
      start_url: '.', display: 'standalone',
      background_color: '#fbf7f3', theme_color: '#e0362f',
      icons: [{ src: ASSET.icon || '', sizes: '512x512', type: 'image/png', purpose: 'any' }]
    };
    if (!m.icons[0].src) delete m.icons;
    var url = URL.createObjectURL(new Blob([JSON.stringify(m)], { type: 'application/manifest+json' }));
    var link = document.createElement('link');
    link.rel = 'manifest'; link.href = url;
    document.head.appendChild(link);
  } catch (e) {}
})();

/* Clear anything a previous build of this app left behind that should never
   have been on the device in the first place. */
LS.del('role');
(function () {
  try {
    var stale = LS.get('shop', null);
    if (stale && 'adminPin' in stale) { delete stale.adminPin; LS.set('shop', stale); }
  } catch (e) {}
  LS.del('session');
  LS.del('auth'); /* old bearer token; new backend uses HttpOnly cookie */
  LS.del('rates'); /* prices now come from MongoDB; remove stale browser-only rates */
})();

restoreNav();
S.screen = 'boot';
render();

/* Returning users are checked through the HttpOnly session cookie before any
   registration/name form is shown. localStorage is only a profile cache. */
api('GET', '/api/me').then(function (r) {
  setSession(r.user);
  S.authStep = 'login';
  S.screen = 'home';
  render();
  syncFromServer();
}).catch(function () {
  forceLogout();
  render();
  syncFromServer();
});

if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(function () {});

/* Owner mode is a 30-minute lease. When it lapses, drop back to a customer
   view rather than leaving admin buttons on screen that would 403. */
setInterval(function () {
  if (!API.adminToken) return;
  api('GET', '/api/admin/status').then(function (r) {
    if (!r.unlocked) { API.adminToken = null; render(); }
  }).catch(function () {});
}, 60000);

</script>
